
name: YARA Engine Tests

on:
  push:
    branches:
      - feature/yara
  pull_request:
    branches:
      - integration

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run YARA tests
        run: |
           python yara/tests/test_scanner.py
